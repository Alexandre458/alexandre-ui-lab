# Servido pelo Nginx Proxy Manager via /data/nginx/custom/http.conf.
server {
    listen 80;
    listen [::]:80;
    server_name ui.alexandresilva.dev;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 308 https://ui.alexandresilva.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ui.alexandresilva.dev;

    ssl_certificate /etc/letsencrypt/live/ui.alexandresilva.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.alexandresilva.dev/privkey.pem;

    root /data/ui-lab/current;
    index index.html;
    charset utf-8;
    access_log /data/logs/ui-lab_access.log;
    error_log /data/logs/ui-lab_error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    error_page 404 /404.html;
}
